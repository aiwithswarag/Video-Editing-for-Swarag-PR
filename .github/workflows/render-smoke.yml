name: Video render smoke test
on:
  push:
    branches: [feat/swarag-video-director]
  pull_request:
jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libgles2 libegl1 libgl1 libglib2.0-0
          command -v ffmpeg
          command -v ffprobe
      - name: Install rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch licensed original models and fonts
        run: python tools/download_assets.py
      - name: Generate a synthetic test clip
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=240x426:rate=8:duration=2' -f lavfi -i 'sine=frequency=330:sample_rate=16000:duration=2' -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest sample.mp4
      - name: Generate executive sample plan
        run: |
          python -c 'import json;json.dump({"effects":[{"fx":"slow-push","start":0,"end":1.2,"zoom":1.08},{"fx":"headline-box","start":0.8,"end":1.8,"text":"Strategy|Execution"}]},open("smoke-plan.json","w"))'
      - name: Run real renderer
        run: python scripts/video_director.py render sample.mp4 smoke-plan.json smoke.mp4 --width 240
      - name: Run chunked renderer with untouched and effect sections
        run: python scripts/render_chunks.py sample.mp4 smoke-plan.json smoke-segmented.mp4 --width 240 --fps 8
      - name: Regression - Cover Star at minimum preview width
        run: |
          python - <<'PY'
          import json
          with open('cover-star-plan.json', 'w') as f:
              json.dump({'effects':[{'fx':'cover-star','start':0,'end':1.7}]}, f)
          PY
          python scripts/video_director.py render sample.mp4 cover-star-plan.json cover-star-small.mp4 --width 240
          test -s cover-star-small.mp4
      - name: Test Executive Editorial V2 finishing pass
        run: |
          python - <<'PY'
          import json
          with open('editorial-smoke.json', 'w') as f:
              json.dump({'duration': 2, 'beats': [{'kind':'opener', 'start':0.15, 'end':1.6, 'eyebrow':'SWARAG / NOTES', 'headline':'Clear thinking.', 'name':'SWARAG', 'subline':'STRATEGY / DELIVERY'}]}, f)
          PY
          python scripts/editorial_director.py sample.mp4 editorial-smoke.json editorial-smoke.mp4 --seconds 1.8 --width 360 --fps 12
          test -s editorial-smoke.mp4
          ffprobe -v error -show_entries stream=codec_type -of default=nw=1 editorial-smoke.mp4 | grep video
          ffprobe -v error -show_entries stream=codec_type -of default=nw=1 editorial-smoke.mp4 | grep audio
      - name: Test real-audio timing and transcript-grounded storyboard
        run: |
          python tools/audio_pause_map.py sample.mp4 --output pause-smoke.json
          python - <<'PY'
          import json
          with open('timed-words-demo.json', 'w') as f:
              json.dump([{'w':'Clear','s':0.2,'e':0.45},{'w':'thinking.','s':0.48,'e':0.76}],f)
          PY
          python tools/transcript_storyboard.py timed-words-demo.json --duration 2 --output speech-storyboard-smoke.json
          python - <<'PY'
          import json
          p=json.load(open('pause-smoke.json'))
          s=json.load(open('speech-storyboard-smoke.json'))
          assert p['kind']=='audio_pause_map'
          assert s['beats'][0]['headline']=='Clear thinking.'
          assert 'DRAFT' in s['status']
          PY
      - name: Non-destructive audio QC
        run: |
          python tools/audio_quality_report.py sample.mp4 --output audio-qa-smoke.json
          python - <<'PY'
          import json
          r=json.load(open('audio-qa-smoke.json'))
          assert r['source_preserved'] is True
          assert 'integrated_lufs' in r
          assert 'true_peak_dbtp' in r
          PY
      - name: Verify segmented native-resolution editorial export
        run: |
          python - <<'PY'
          import json
          story={"beats":[{"kind":"opener","start":0.25,"end":1.55,
                          "name":"SWARAG","subline":"EXECUTIVE NOTES"}]}
          with open("identity-smoke.json","w") as f:json.dump(story,f)
          PY
          python scripts/render_editorial_master.py sample.mp4 identity-smoke.json native-identity-smoke.mp4 --width 360 --fps 12
          test -s native-identity-smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 native-identity-smoke.mp4 | grep '360,'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 native-identity-smoke.mp4 | grep audio
      - name: Verify master duration, FPS and original AAC bitstream
        run: |
          python tools/master_quality_check.py sample.mp4 native-identity-smoke.mp4 --output master-qa-smoke.json --expected-width 360 --allow-fps-change
          python - <<'PY'
          import json
          report=json.load(open('master-qa-smoke.json'))
          assert report['technical_status']=='PASS'
          assert report['audio_bitstream_identical'] is True
          assert report['creative_status'].startswith('NOT APPROVED')
          PY
      - name: Verify pause-led virtual camera director
        run: |
          python scripts/render_directors_cut.py sample.mp4 examples/camera-reframes-demo.json camera-smoke.mp4 --width 360
          python tools/master_quality_check.py sample.mp4 camera-smoke.mp4 --expected-width 360 --output camera-qa-smoke.json
          python - <<'PY'
          import json
          report=json.load(open('camera-qa-smoke.json'))
          assert report['technical_status']=='PASS'
          assert report['audio_bitstream_identical'] is True
          PY
      - name: Build optional two-pass voice-level review
        run: |
          python tools/two_pass_dialogue_master.py sample.mp4 audio-master-smoke.mp4 --lufs -18 --true-peak -1.9 --report audio-master-smoke.json
          python tools/master_quality_check.py sample.mp4 audio-master-smoke.mp4 --allow-audio-remaster --output audio-master-technical-qa.json
          python - <<'PY'
          import json
          report=json.load(open('audio-master-smoke.json'))
          assert report['technical_loudness_status']=='PASS'
          assert report['creative_status'].startswith('NOT APPROVED')
          PY
      - name: Verify offline ASR JSON adapter without personal audio
        run: |
          python - <<'PY'
          from tools.transcribe_offline import normalize
          segments=[{'text':word,'offsets':{'from':i*180,'to':(i+1)*180}}
                    for i,word in enumerate(['World','models','predict','what','happens'])]
          result=normalize({'transcription':segments},2.0)
          assert len(result['words'])==5
          assert result['transcript_verified'] is False
          assert result['kind']=='private_asr_word_draft'
          PY
      - name: Verify streams and duration
        run: |
          test -s smoke.mp4
          test -s smoke-segmented.mp4
          ffprobe -v error -show_entries stream=codec_type -of default=nw=1 smoke-segmented.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 smoke.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 smoke.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-render-smoke
          path: |
            smoke.mp4
            smoke-segmented.mp4
            cover-star-small.mp4
            editorial-smoke.mp4
            native-identity-smoke.mp4
            camera-smoke.mp4
            audio-master-smoke.mp4
            smoke-plan.json
          if-no-files-found: ignore
          retention-days: 7
