name: Validate video director
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=10,<13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tools
      - run: python scripts/video_director.py validate examples/executive.json --duration 30
